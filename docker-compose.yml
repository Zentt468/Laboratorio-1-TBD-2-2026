version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: alojamientos-postgres
    restart: "no"
    environment:
      POSTGRES_DB: alojamientos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: alojamientos-keycloak
    restart: "no"
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/alojamientos-realm-realm.json:/opt/keycloak/data/import/alojamientos-realm-realm.json:ro

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: alojamientos-backend
    restart: "no"
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/alojamientos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_SESSION_STORE_TYPE: none
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/alojamientos-realm
    depends_on:
      - postgres-db
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alojamientos-frontend-app
    restart: "no"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
