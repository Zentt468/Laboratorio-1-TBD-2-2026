spring.application.name=demo


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alojamientos-postgres}
spring.datasource.username=postgres
spring.datasource.password=password

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:procedures.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.separator=^;

spring.jpa.hibernate.ddl-auto=none

# Conexion a Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/alojamientos-realm

